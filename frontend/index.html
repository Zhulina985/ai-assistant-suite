<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英语口语陪练</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <h1>英语口语陪练</h1>
      <p class="subtitle">
        <span id="status-dot" class="status-dot warn"></span>
        <span id="status-text">正在连接后端...</span>
      </p>

      <div class="model-toggle-card">
        <label class="toggle-row">
          <span>使用 AI 模型</span>
          <input type="checkbox" id="use-model-checkbox" disabled />
        </label>
        <p id="toggle-hint" class="toggle-hint">正在连接后端，请稍候...</p>
      </div>

      <div id="user-info" class="user-badge hidden"></div>
      <button id="btn-logout" class="btn btn-ghost btn-logout hidden" type="button">退出登录</button>

      <div class="sidebar-tips">
        <h3>使用提示</h3>
        <ul>
          <li>选择场景与水平后点击「开始练习」</li>
          <li>支持文字输入或语音输入</li>
          <li>结束后可查看课后总结</li>
        </ul>
      </div>
    </aside>

    <!-- 右侧主区域 -->
    <main class="main" id="main-area">
      <!-- 加载中 -->
      <div id="loading-view" class="main-loading">
        <p>正在连接后端服务...</p>
      </div>

      <!-- 练习页面 -->
      <div id="app-view" class="speaking-page hidden">
        <!-- 第一步：选择场景 -->
        <section id="setup-section" class="setup-section">
          <p class="page-desc">选择场景进行真实对话训练，支持语音输入、发音评测与语法纠错。</p>

          <div class="card grid-2">
            <div>
              <label for="scenario-select">练习场景</label>
              <select id="scenario-select">
                <option value="interview">面试</option>
                <option value="restaurant">点餐</option>
                <option value="meeting">会议</option>
                <option value="travel">旅行</option>
                <option value="daily">日常对话</option>
              </select>
            </div>
            <div>
              <label for="level-select">英语水平</label>
              <select id="level-select">
                <option value="beginner">初级</option>
                <option value="intermediate" selected>中级</option>
                <option value="advanced">高级</option>
              </select>
            </div>
          </div>

          <div class="btn-row">
            <button id="btn-start" class="btn btn-primary" disabled>开始练习</button>
          </div>
        </section>

        <!-- 第二步：对话中 -->
        <section id="chat-section" class="hidden">
          <div class="session-bar">
            <div class="session-info">
              <span id="session-scenario" class="session-tag">面试</span>
              <span id="session-level" class="session-tag muted">中级</span>
              <span id="session-turns" class="session-meta">已对话 0 轮</span>
            </div>
            <div class="btn-row session-actions">
              <button id="btn-voice" class="btn btn-success">语音输入</button>
              <button id="btn-summary" class="btn btn-ghost">结束并总结</button>
              <button id="btn-restart" class="btn btn-ghost">重新开始</button>
            </div>
          </div>

          <div class="card chat-card">
            <div id="chat-window" class="chat-window" role="log" aria-live="polite" aria-label="对话记录">
              <!-- 消息由 JS 动态插入 -->
            </div>
            <div id="chat-input-row" class="chat-input-row">
              <input id="message-input" type="text" placeholder="输入英文，按 Enter 发送..." aria-label="输入英文消息" />
              <button id="btn-send" class="btn btn-primary">发送</button>
            </div>
          </div>
        </section>

        <!-- 错误提示 -->
        <div id="error-banner" class="error-banner hidden" role="alert"></div>

        <!-- 第三步：课后总结 -->
        <section id="summary-section" class="card summary-card hidden">
          <div class="summary-header">
            <h3>课后总结</h3>
            <button id="btn-again" class="btn btn-primary">再练一次</button>
          </div>
          <div class="stats-grid">
            <div class="stat-item">
              <div id="stat-score" class="stat-value">0</div>
              <div class="stat-label">综合评分</div>
            </div>
            <div class="stat-item">
              <div id="stat-strengths" class="stat-value">0</div>
              <div class="stat-label">优势项</div>
            </div>
            <div class="stat-item">
              <div id="stat-improvements" class="stat-value">0</div>
              <div class="stat-label">待提升</div>
            </div>
          </div>
          <div class="summary-details">
            <p><strong>优势：</strong><span id="summary-strengths"></span></p>
            <p><strong>改进建议：</strong><span id="summary-improvements"></span></p>
            <p><strong>下步计划：</strong><span id="summary-next"></span></p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- 按顺序加载 JS 文件 -->
  <script src="js/api.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
