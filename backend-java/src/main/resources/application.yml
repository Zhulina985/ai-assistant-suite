server:
  port: 8000

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 25MB

aisuite:
  openai-api-key: ${OPENAI_API_KEY:}
  openai-base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
  openai-model: ${OPENAI_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
  cors-origins: http://localhost:5173,http://127.0.0.1:5173
