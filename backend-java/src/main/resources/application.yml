server:
  port: 8000

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 25MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:speaking_coach}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

aisuite:
  openai-api-key: ${OPENAI_API_KEY:}
  openai-base-url: ${OPENAI_BASE_URL:https://openrouter.ai/api/v1}
  openai-model: ${OPENAI_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
  cors-origins: http://127.0.0.1:5173,http://localhost:5173
